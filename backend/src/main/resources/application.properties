spring.application.name=prometheus-watcher
server.port=8080

# --- Datasource: Supabase Postgres (values injected from environment) -------
# NEVER hardcode credentials here. Provide via .env / environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is created by supabase/migrations/0001_init.sql.
# 'validate' confirms entities match that schema; set to 'none' to skip checks.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HikariCP: Supabase pooler tolerates a small pool well for a single-user tool.
spring.datasource.hikari.maximum-pool-size=5

# --- Scraper service (HTTP only) -------------------------------------------
prometheus.scraper.base-url=${SCRAPER_BASE_URL:http://localhost:8000}

# --- Scheduler --------------------------------------------------------------
prometheus.watcher.cron=${WATCHER_CRON:0 0 8 * * *}
prometheus.watcher.zone=${WATCHER_ZONE:UTC}

# --- CORS (React frontend origin) ------------------------------------------
prometheus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- AWS (Polly TTS + S3 audio) --------------------------------------------
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are read directly by the AWS SDK
# from env vars — no Spring property mapping needed for credentials.
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.audio-bucket=${AWS_S3_AUDIO_BUCKET}
aws.audio.presigned-url-expiry-hours=${AWS_AUDIO_URL_EXPIRY_HOURS:1}

# Audio cleanup: delete S3 objects + DB rows older than N days (default 30).
prometheus.audio.cleanup-after-days=${AUDIO_CLEANUP_DAYS:30}
